# api: REST + SSE + raw qbXML. Reached through the web container's /api proxy.
# Variables are documented in apps/api/README.md and docs/configuration.md.
services:
  api:
    build:
      context: ../..
      dockerfile: docker/node.Dockerfile
      args:
        SERVICE: api
    image: qbv/api:local
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-qbv}:${POSTGRES_PASSWORD:-qbv}@postgres:5432/${POSTGRES_DB:-qbv}
      REDIS_URL: redis://redis:6379
      QUEUE_PREFIX: ${QUEUE_PREFIX:-qbv}
      API_HOST: 0.0.0.0
      API_PORT: '3100'
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8180}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL: ${SESSION_TTL:-12h}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_WRITES_PER_MIN: ${RATE_LIMIT_WRITES_PER_MIN:-120}
      RATE_LIMIT_QBXML_PER_MIN: ${RATE_LIMIT_QBXML_PER_MIN:-60}
      COMMAND_WAIT_TIMEOUT: ${COMMAND_WAIT_TIMEOUT:-30s}
      REPORT_CACHE_TTL: ${REPORT_CACHE_TTL:-15m}
      QBXML_VERSION: ${QBXML_VERSION:-16.0}
      # Optional: lets /api/health ping the relay directly. Without it, health
      # shows the last relay.health event published by the worker.
      RELAY_URL: ${RELAY_URL:-}
      RELAY_API_KEY: ${RELAY_API_KEY:-}
    expose:
      - '3100'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
