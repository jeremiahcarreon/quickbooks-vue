# Rendered by the nginx image's envsubst step: only ${API_UPSTREAM} is replaced.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Server-Sent Events: no buffering, long-lived connection.
    location = /api/events {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Accel-Buffering no always;
    }

    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ?wait=true can hold a request for up to 30s; QuickBooks reports can take longer.
        proxy_read_timeout 180s;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback; index.html must always be revalidated.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
