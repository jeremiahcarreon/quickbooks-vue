{{- $c := .Values.api }}
{{- $ctx := dict "root" . "component" "api" }}
{{- $image := include "qbv.image" (dict "root" . "service" "api" "values" $c) }}
{{- $pull := include "qbv.pullPolicy" (dict "root" . "values" $c) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qbv.componentName" $ctx }}
  labels:
    {{- include "qbv.componentLabels" $ctx | nindent 4 }}
spec:
  {{- if not $c.autoscaling.enabled }}
  replicas: {{ $c.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "qbv.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qbv.componentSelectorLabels" $ctx | nindent 8 }}
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "qbv.configChecksum" . }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "qbv.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with (include "qbv.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "qbv.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      {{- with (include "qbv.scheduling" $c) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "qbv.waitForSchema" (dict "root" . "image" $image "pullPolicy" $pull)) }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ $image }}
          imagePullPolicy: {{ $pull }}
          command: ["node", "dist/main.js"]
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "qbv.fullname" . }}-config
          env:
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "3100"
            {{- include "qbv.secretEnv" (dict "root" . "keys" (list "DATABASE_URL" "REDIS_URL" "SESSION_SECRET" "RELAY_API_KEY")) | trim | nindent 12 }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $c.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $c.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $c.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "qbv.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qbv.componentName" $ctx }}
  labels:
    {{- include "qbv.componentLabels" $ctx | nindent 4 }}
  {{- with $c.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $c.service.type }}
  selector:
    {{- include "qbv.componentSelectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (has $c.service.type (list "NodePort" "LoadBalancer")) $c.service.nodePort }}
      nodePort: {{ $c.service.nodePort }}
      {{- end }}
{{- if $c.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "qbv.componentName" $ctx }}
  labels:
    {{- include "qbv.componentLabels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "qbv.componentName" $ctx }}
  minReplicas: {{ $c.autoscaling.minReplicas }}
  maxReplicas: {{ $c.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $c.autoscaling.targetCPUUtilizationPercentage }}
    {{- with $c.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
{{- end }}
{{- if and $c.pdb.enabled (or $c.autoscaling.enabled (gt (int $c.replicaCount) 1)) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "qbv.componentName" $ctx }}
  labels:
    {{- include "qbv.componentLabels" $ctx | nindent 4 }}
spec:
  maxUnavailable: {{ $c.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "qbv.componentSelectorLabels" $ctx | nindent 6 }}
{{- end }}
