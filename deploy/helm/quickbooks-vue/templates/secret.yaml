{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qbv.fullname" . }}
  labels:
    {{- include "qbv.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and $s.databaseUrl (not .Values.postgresql.enabled) }}
  DATABASE_URL: {{ $s.databaseUrl | quote }}
  {{- end }}
  {{- if and $s.redisUrl (not .Values.redis.enabled) }}
  REDIS_URL: {{ $s.redisUrl | quote }}
  {{- end }}
  SESSION_SECRET: {{ include "qbv.sessionSecret" . | quote }}
  RELAY_API_KEY: {{ $s.relayApiKey | default "" | quote }}
  {{- if $s.adminEmail }}
  ADMIN_EMAIL: {{ $s.adminEmail | quote }}
  {{- end }}
  {{- if $s.adminPassword }}
  ADMIN_PASSWORD: {{ $s.adminPassword | quote }}
  {{- end }}
{{- if eq (include "qbv.migrateMode" .) "hook" }}
---
# Copy for the pre-install/pre-upgrade migrate hook: on a first install the
# Secret above does not exist yet when hooks run. Deleted once the hook succeeds.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qbv.migrateSecretName" . }}
  labels:
    {{- include "qbv.componentLabels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  DATABASE_URL: {{ $s.databaseUrl | quote }}
  {{- if $s.adminEmail }}
  ADMIN_EMAIL: {{ $s.adminEmail | quote }}
  {{- end }}
  {{- if $s.adminPassword }}
  ADMIN_PASSWORD: {{ $s.adminPassword | quote }}
  {{- end }}
{{- end }}
{{- end }}
