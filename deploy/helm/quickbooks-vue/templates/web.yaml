{{- $c := .Values.web }}
{{- $ctx := dict "root" . "component" "web" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qbv.componentName" $ctx }}
  labels:
    {{- include "qbv.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $c.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "qbv.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qbv.componentSelectorLabels" $ctx | nindent 8 }}
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "qbv.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with (include "qbv.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- toYaml $c.podSecurityContext | nindent 8 }}
        {{- if $c.unprivilegedPortSysctl }}
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
        {{- end }}
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      {{- with (include "qbv.scheduling" $c) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "qbv.image" (dict "root" . "service" "web" "values" $c) }}
          imagePullPolicy: {{ include "qbv.pullPolicy" (dict "root" . "values" $c) }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            # nginx /api proxy target (rendered from the image's template at start).
            - name: API_UPSTREAM
              value: {{ printf "http://%s:%d" (include "qbv.componentName" (dict "root" . "component" "api")) (int .Values.api.service.port) | quote }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $c.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $c.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "qbv.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            # Writable paths of the read-only nginx image.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qbv.componentName" $ctx }}
  labels:
    {{- include "qbv.componentLabels" $ctx | nindent 4 }}
  {{- with $c.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $c.service.type }}
  selector:
    {{- include "qbv.componentSelectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (has $c.service.type (list "NodePort" "LoadBalancer")) $c.service.nodePort }}
      nodePort: {{ $c.service.nodePort }}
      {{- end }}
{{- if and $c.pdb.enabled (gt (int $c.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "qbv.componentName" $ctx }}
  labels:
    {{- include "qbv.componentLabels" $ctx | nindent 4 }}
spec:
  maxUnavailable: {{ $c.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "qbv.componentSelectorLabels" $ctx | nindent 6 }}
{{- end }}
